<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 배경 떠다니는 도형 -->
  <div class="bg-shapes">
    <span class="shape s1"></span>
    <span class="shape s2"></span>
    <span class="shape s3"></span>
    <span class="shape s4"></span>
    <span class="shape s5"></span>
  </div>

  <!-- 헤더 -->
  <header class="hero">
    <h1 class="hero-title">CSS Animation Playground</h1>
    <p class="hero-sub">순수 CSS로 그려낸 움직이는 화면</p>
    <div class="scroll-hint">
      <span></span>
    </div>
  </header>

  <main>

    <!-- 1. 로딩 스피너 모음 -->
    <section class="section">
      <h2 class="section-title">Loaders</h2>
      <div class="grid">
        <div class="card">
          <div class="loader-ring"></div>
          <p class="card-label">Ring</p>
        </div>
        <div class="card">
          <div class="loader-dots">
            <span></span><span></span><span></span>
          </div>
          <p class="card-label">Dots</p>
        </div>
        <div class="card">
          <div class="loader-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <p class="card-label">Bars</p>
        </div>
        <div class="card">
          <div class="loader-cube">
            <span></span><span></span><span></span><span></span>
          </div>
          <p class="card-label">Cube Flip</p>
        </div>
      </div>
    </section>

    <!-- 2. 호버 효과 버튼 -->
    <section class="section">
      <h2 class="section-title">Hover Buttons</h2>
      <div class="grid">
        <div class="card">
          <button class="btn btn-fill">Fill</button>
        </div>
        <div class="card">
          <button class="btn btn-shine">Shine</button>
        </div>
        <div class="card">
          <button class="btn btn-grow">Grow</button>
        </div>
        <div class="card">
          <button class="btn btn-border">Border Run</button>
        </div>
      </div>
    </section>

    <!-- 3. 변형 도형 -->
    <section class="section">
      <h2 class="section-title">Morphing Shapes</h2>
      <div class="grid">
        <div class="card">
          <div class="morph-blob"></div>
          <p class="card-label">Blob</p>
        </div>
        <div class="card">
          <div class="rotate-3d"></div>
          <p class="card-label">3D Cube</p>
        </div>
        <div class="card">
          <div class="pulse-heart"></div>
          <p class="card-label">Heartbeat</p>
        </div>
        <div class="card">
          <div class="spin-square"></div>
          <p class="card-label">Color Spin</p>
        </div>
      </div>
    </section>

    <!-- 4. 텍스트 애니메이션 -->
    <section class="section">
      <h2 class="section-title">Text Effects</h2>
      <div class="text-stage">
        <p class="text-gradient">GRADIENT FLOW</p>
        <p class="text-wave">
          <span>W</span><span>A</span><span>V</span><span>E</span>
          <span>&nbsp;</span>
          <span>T</span><span>E</span><span>X</span><span>T</span>
        </p>
        <p class="text-typing">타이핑되는 문장입니다_</p>
        <p class="text-glow">NEON GLOW</p>
      </div>
    </section>

    <!-- 5. 무한 장면 -->
    <section class="section">
      <h2 class="section-title">Living Scene</h2>
      <div class="scene">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="hill"></div>
        <div class="wave-line"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>made with pure CSS · no javascript</p>
  </footer>

</body>
</html>
